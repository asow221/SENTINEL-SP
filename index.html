<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020705">
  <meta name="application-name" content="SENTINEL Investissement">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SENTINEL Investissement">
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>SENTINEL Investissement</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#020705;color-scheme:dark;overflow:hidden}
    iframe{position:fixed;inset:env(safe-area-inset-top) 0 0 0;width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#020705}
  </style>
</head>
<body>
  <iframe id="sentinelApp" src="https://script.google.com/macros/s/AKfycbyt2ODRbFaw7wo21xWEk8Xab2JMFfykN5BQmoRQFoVaBwm7A0L1SSQerwts5BVFfTCp7Q/exec" title="SENTINEL Investissement" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    // La session est conservée sur notre domaine, indépendamment de l'iframe Google.
    // Aucun mot de passe n'est enregistré ici : seul un jeton temporaire est utilisé.
    (function(){
      'use strict';
      const KEY='sentinel_sp_site_session_v2_7d';
      const MAX_MS=7*24*60*60*1000;
      const app=document.getElementById('sentinelApp');
      function getSession(){
        try{
          const data=JSON.parse(localStorage.getItem(KEY)||'null');
          if(!data||typeof data.token!=='string'||data.token.length<32||!Number.isFinite(data.expiresAt)||data.expiresAt<=Date.now()||data.expiresAt>Date.now()+MAX_MS){localStorage.removeItem(KEY);return null;}
          return data;
        }catch(_){return null;}
      }
      function allowedAppsScriptOrigin(origin){
        try{
          const u=new URL(origin);
          return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname.endsWith('.googleusercontent.com'));
        }catch(_){return false;}
      }
      window.addEventListener('message',function(event){
        if(!allowedAppsScriptOrigin(event.origin))return;
        const data=event.data;
        if(!data||typeof data!=='object'||typeof data.type!=='string'||!data.type.startsWith('sentinel.session.'))return;
        // Le navigateur charge seulement notre application dans un iframe Google.
        // Dans Apps Script, le vrai HTML est lui-même un iframe imbriqué.
        if(data.type==='sentinel.session.get'){
          const active=getSession();
          try{event.source.postMessage({type:'sentinel.session.value',token:active?active.token:'',expiresAt:active?active.expiresAt:0},event.origin)}catch(_){}
        }else if(data.type==='sentinel.session.set'){
          const token=typeof data.token==='string'?data.token:'';
          const expiresAt=Number(data.expiresAt);
          if(token.length>=32&&Number.isFinite(expiresAt)&&expiresAt>Date.now()&&expiresAt<=Date.now()+MAX_MS){
            try{localStorage.setItem(KEY,JSON.stringify({token,expiresAt}))}catch(_){}
          }
        }else if(data.type==='sentinel.session.clear'){
          try{localStorage.removeItem(KEY)}catch(_){}
        }
      });
      // Pas de stockage du mot de passe, de jeton dans l'URL, ni de tiers analytics.
    })();
  </script>
</body>
</html>
